name: CI

# CI was broken from the start: the original workflow tried to `cd frontend`
# in a job whose body referenced a directory that didn't exist, and a later
# attempt to gate that job with `if: hashFiles('frontend/package.json') != ''`
# at the JOB level was rejected by the parser ("Unrecognized function")
# because hashFiles() runs before checkout — there are no files to hash. The
# whole workflow file was failing YAML validation, so neither job ever ran.
#
# The frontend job is removed entirely until real frontend code lands. When
# `frontend/package.json` is committed in a future PR, add a new `frontend:`
# job here that gates correctly (step-level checks AFTER actions/checkout, or
# a top-level workflow `paths:` trigger filter).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: logguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      - name: Lint with ruff
        run: |
          cd backend
          ruff check .
      - name: Type check with mypy
        run: |
          cd backend
          mypy . || true   # advisory until typing is stable
      - name: Run tests
        env:
          LOGGUARD_DB_URL: postgresql://postgres:postgres@localhost:5432/logguard_test
          LOGGUARD_REDIS_URL: redis://localhost:6379/0
        run: |
          cd backend
          pytest -v
